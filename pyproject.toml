[project]
name = "flow-agent-cleanup"
version = "0.1.0"
description = "Agent Cleanup for hmz: a Ralph loop or a flame chase whose workspace a cleaner agent distills between turns."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/humanfia/flow-agent-cleanup"
Issues = "https://github.com/humanfia/flow-agent-cleanup/issues"

[dependency-groups]
dev = [
    "hmz @ git+https://github.com/humanfia/humanize",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "ruff>=0.16.5",
]

[tool.uv]
# The flow is a directory hmz imports, not a package anybody installs.
package = false

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # The formatter owns line length; prose it cannot split is left as written.
    "E501",
    # Flow state is read as the flow API documents it, which is not as a dict.
    "SIM401",
]
